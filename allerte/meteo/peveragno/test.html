<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>PDF come immagine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>img{max-width:100%;height:auto;border:1px solid #ccc}</style>
</head>
<body>
  <h3>PDF come immagine</h3>
  <p id="status">Caricamento...</p>
  <img id="pdfImage" alt="PDF come immagine">
  <script>
    const pdfUrl = "https://www.arpa.piemonte.it/rischi_naturali/boll/bollettino_analisimeteo.pdf";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const status = document.getElementById('status');
    const img = document.getElementById('pdfImage');

    pdfjsLib.getDocument(pdfUrl).promise
      .then(pdf => pdf.getPage(1))
      .then(page => {
        const scale = 2;
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise.then(() => canvas);
      })
      .then(canvas => {
        img.src = canvas.toDataURL('image/png');
        status.textContent = 'Caricato.';
      })
      .catch(err => {
        console.error(err);
        status.textContent = 'Errore nel caricamento del PDF. Controlla CORS in console.';
      });
  </script>
</body>
</html>
